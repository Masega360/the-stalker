<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Emotion Light</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=Space+Grotesk:wght@400;700&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{background:#08080d;overflow:hidden;font-family:'Inter',sans-serif;color:#fff;height:100vh;width:100vw}

.circuit-world{
  position:absolute;
  width:2200px;height:1200px;
  top:50%;left:50%;
  transform-origin:center center;
  transition:transform 1.6s cubic-bezier(.22,.61,.36,1);
}

.component{
  position:absolute;
  transition:filter .8s ease,opacity .8s ease;
}
.component.dimmed{filter:brightness(.15) saturate(0);opacity:.25}

/* Posiciones simétricas - layout horizontal flujo izq a der */
#esp32cam{top:80px;left:80px;width:180px;height:200px}
#cloud-worker{top:60px;left:450px;width:200px;height:200px}
#cloud-mqtt{top:60px;left:800px;width:200px;height:200px}
#cloud-db{top:400px;left:450px;width:200px;height:200px}
#cloud-nuxt{top:400px;left:800px;width:200px;height:200px}
#esp32{top:400px;left:1150px;width:200px;height:180px}
#relay{top:700px;left:1150px;width:200px;height:180px}
#bombilla{top:700px;left:1500px;width:150px;height:150px}
#fuente{top:920px;left:1300px;width:180px;height:140px}

.wires{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none}
.wires path{fill:none;stroke-width:2.5;stroke-linecap:round}
.wire-data{stroke:#a855f7;stroke-dasharray:8 5;animation:dash 3s linear infinite}
.wire-mqtt{stroke:#06b6d4;stroke-dasharray:6 4;animation:dash 2.5s linear infinite}
.wire-db{stroke:#f59e0b;stroke-dasharray:5 4;animation:dash 4s linear infinite}
.wire-hw{stroke:#4ade80;opacity:.7}
.wire-power{stroke:#ef4444;opacity:.6}
@keyframes dash{to{stroke-dashoffset:-26}}

.info-panel{
  position:fixed;right:40px;top:50%;width:320px;
  background:rgba(255,255,255,.03);backdrop-filter:blur(20px);
  border:1px solid rgba(255,255,255,.08);border-radius:24px;padding:32px;
  opacity:0;pointer-events:none;
  transform:translateY(-50%) translateX(30px);
  transition:all .8s cubic-bezier(.22,.61,.36,1);
}
.info-panel.visible{opacity:1;pointer-events:all;transform:translateY(-50%) translateX(0)}
.info-panel h2{
  font-family:'Space Grotesk',sans-serif;font-size:1.5rem;font-weight:700;margin-bottom:10px;
  background:linear-gradient(135deg,#a855f7,#6366f1);-webkit-background-clip:text;-webkit-text-fill-color:transparent;
}
.info-panel .tag{
  display:inline-block;padding:4px 12px;
  background:rgba(168,85,247,.12);border:1px solid rgba(168,85,247,.3);
  border-radius:20px;font-size:.7rem;font-weight:600;color:#a855f7;margin-bottom:14px;
}
.info-panel p{font-size:.9rem;line-height:1.7;color:rgba(255,255,255,.7);font-weight:300}
.info-panel .detail{margin-top:14px;padding-top:14px;border-top:1px solid rgba(255,255,255,.06);font-size:.78rem;color:rgba(255,255,255,.4)}

.title-slide{
  position:fixed;top:0;left:0;width:100%;height:100%;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  z-index:50;background:#08080d;
  transition:opacity .8s ease,transform .8s ease;
}
.title-slide.hidden{opacity:0;pointer-events:none;transform:scale(.95)}
.title-slide h1{
  font-family:'Space Grotesk',sans-serif;font-size:3.2rem;font-weight:800;
  background:linear-gradient(135deg,#fff 30%,#a855f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent;
}
.title-slide p{font-size:1.05rem;color:rgba(255,255,255,.45);font-weight:300;margin-top:10px}

.nav{
  position:fixed;bottom:36px;left:50%;transform:translateX(-50%);
  display:flex;gap:12px;align-items:center;z-index:100;
}
.nav button{
  width:48px;height:48px;border-radius:50%;
  border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.03);
  backdrop-filter:blur(10px);color:#fff;font-size:1.1rem;cursor:pointer;
  transition:all .3s ease;display:flex;align-items:center;justify-content:center;
}
.nav button:hover{background:rgba(168,85,247,.2);border-color:rgba(168,85,247,.5);transform:scale(1.1)}
.nav .step{font-size:.75rem;color:rgba(255,255,255,.35);padding:0 14px;font-weight:600;letter-spacing:2px}

.progress{position:fixed;top:0;left:0;height:3px;background:linear-gradient(90deg,#a855f7,#6366f1,#ec4899);transition:width 1.2s cubic-bezier(.22,.61,.36,1);z-index:200}

.particles{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:-1}
.particle{
  position:absolute;width:2px;height:2px;background:rgba(168,85,247,.25);
  border-radius:50%;animation:float linear infinite;
}
@keyframes float{
  0%{transform:translateY(100vh);opacity:0}
  10%{opacity:1}90%{opacity:1}
  100%{transform:translateY(-50px);opacity:0}
}
.hint{position:fixed;bottom:92px;left:50%;transform:translateX(-50%);font-size:.7rem;color:rgba(255,255,255,.2);letter-spacing:1px}
</style>
</head>

<script>

  {

  },
  {
    // 3 - EC2 Worker
    tx: 5, ty: 37, scale: 2.2, rot: 1,
    titleVisible: false,
    highlight: 'cloud-worker',

let cur = 0;

function goTo(i) {
  if (i < 0 || i >= slides.length) return;
  cur = i;
  const s = slides[i];

  // Transform: centra el world en el componente objetivo
  world.style.transform =
    `translate(${s.tx}%, ${s.ty}%) scale(${s.scale}) rotate(${s.rot}deg)`;

  // Title slide
  if (s.titleVisible) {
    titleSlide.classList.remove('hidden');
    world.style.visibility = 'hidden';
  } else {
    titleSlide.classList.add('hidden');
    world.style.visibility = 'visible';
  }

  // Info panel
  if (s.tag) {
    document.getElementById('infoTag').textContent = s.tag;
    document.getElementById('infoTitle').textContent = s.title;
    document.getElementById('infoText').textContent = s.text;
    document.getElementById('infoDetail').textContent = s.detail;
    infoPanel.classList.add('visible');
  } else {
    infoPanel.classList.remove('visible');
  }

  // Highlight
  document.querySelectorAll('.component').forEach(c => {
    if (s.highlight && c.id !== s.highlight) c.classList.add('dimmed');
    else c.classList.remove('dimmed');
  });

  // Progress & step
  progress.style.width = (i / (slides.length - 1) * 100) + '%';
  stepInd.textContent = `${i} / ${slides.length - 1}`;
}

document.getElementById('nextBtn').addEventListener('click', () => goTo(cur + 1));
document.getElementById('prevBtn').addEventListener('click', () => goTo(cur - 1));
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === ' ') goTo(cur + 1);
  if (e.key === 'ArrowLeft') goTo(cur - 1);
});
let tx0 = 0;
document.addEventListener('touchstart', e => tx0 = e.touches[0].clientX);
document.addEventListener('touchend', e => {
  const d = e.changedTouches[0].clientX - tx0;
  if (d < -50) goTo(cur + 1);
  if (d > 50) goTo(cur - 1);
});

// Partículas
const pc = document.getElementById('particles');
for (let i = 0; i < 25; i++) {
  const p = document.createElement('div');
  p.className = 'particle';
  p.style.cssText = `left:${Math.random()*100}%;animation-duration:${9+Math.random()*12}s;animation-delay:${Math.random()*10}s`;
  pc.appendChild(p);
}

goTo(0);
</script>
